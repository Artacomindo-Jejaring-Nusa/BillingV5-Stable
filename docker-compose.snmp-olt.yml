services:
  redis-olt:
    image: redis:7-alpine
    container_name: redis-olt
    restart: unless-stopped
    ports:
      - "6380:6379"
    volumes:
      - redis_olt_data:/data
    networks:
      - snmp_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  snmp-olt-zte:
    image: cepatkilatteknologi/snmp-olt-zte:3.2.0
    container_name: snmp-olt-zte
    restart: unless-stopped
    ports:
      - "8081:8081"
    environment:
      - APP_PORT=8081
      - APP_ENV=production
      - REDIS_HOST=redis-olt
      - REDIS_PORT=6379
      - REDIS_DB=0
      - REDIS_POOL_SIZE=50
      - CACHE_PREWARM=false
      - SNMP_MAX_CONCURRENT=5
      - DEFAULT_OLT=tipar
      # Konfigurasi Multi-OLT ZTE C320 (Ganti IP Host dan Community sesuai OLT Anda)
      - >
        OLTS=[
          {"id":"tipar","name":"OLT Tipar","host":"102.102.1.1","port":161,"community":"public","boards":"1,2"},
          {"id":"pulogebang","name":"OLT Pulogebang","host":"103.103.1.1","port":161,"community":"public","boards":"1,2"},
          {"id":"pinus","name":"OLT Pinus","host":"100.100.1.1","port":161,"community":"public","boards":"1,2"}
        ]
    depends_on:
      redis-olt:
        condition: service_healthy
    networks:
      - snmp_network

networks:
  snmp_network:
    driver: bridge

volumes:
  redis_olt_data:
