$kind: http-request
description: Reset account password using the verification token.
url: "{{base_url}}/users/reset-password"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
        "token": "reset_token_received_from_email",
        "password": "NewSecurePassword123!"
    }
auth:
  type: noauth
order: 7000
